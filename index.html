<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo DCHLOES | Tintadecor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; padding: 10px; }
        .logo { font-size: 24px; font-weight: 700; color: #d4a574; text-align: center; padding: 10px 0; }
        .badge { background: #d4a574; color: #000; padding: 4px 12px; border-radius: 12px; font-size: 11px; display: inline-block; margin: 0 auto 10px; text-align: center; }
        .search-box { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #d4a574; color: #fff; border-radius: 6px; font-size: 14px; margin: 8px 0; }
        .filters { display: flex; gap: 5px; overflow-x: auto; padding: 5px 0; margin-bottom: 10px; }
        .filter-btn { background: #2a2a2a; color: #d4a574; border: 1px solid #d4a574; padding: 6px 12px; border-radius: 20px; font-size: 11px; white-space: nowrap; cursor: pointer; }
        .filter-btn.active { background: #d4a574; color: #000; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 0; }
        .card { background: #2a2a2a; border-radius: 8px; overflow: hidden; border: 1px solid rgba(212,165,116,0.2); }
        .card-img { width: 100%; height: 120px; background: linear-gradient(135deg, #d4a574 0%, #b8895a 100%); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #0a0a0a; }
        .info { padding: 10px; }
        .ref { font-size: 10px; color: #d4a574; font-weight: 600; }
        .name { font-size: 12px; margin: 4px 0; color: #f5f5f5; line-height: 1.3; height: 32px; overflow: hidden; }
        .cat { font-size: 10px; color: rgba(212,165,116,0.7); margin-bottom: 6px; height: 14px; overflow: hidden; }
        .price { font-size: 16px; font-weight: 700; color: #d4a574; margin: 4px 0; }
        .price-old { font-size: 11px; color: #888; text-decoration: line-through; }
        .status { padding: 3px; border-radius: 4px; font-size: 9px; font-weight: 600; text-align: center; margin-top: 4px; }
        .avail { background: rgba(100,200,100,0.2); color: #64c864; }
        .sold { background: rgba(200,100,100,0.2); color: #c86464; }
        .stats { color: #d4a574; font-size: 12px; text-align: center; padding: 8px 0; }
        footer { text-align: center; color: rgba(255,255,255,0.4); font-size: 10px; padding: 15px 0; }
        .loading { text-align: center; padding: 40px; color: #d4a574; font-size: 14px; }
        .error { text-align: center; padding: 40px; color: #c86464; font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [productos, setProductos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [search, setSearch] = useState('');
            const [categoria, setCategoria] = useState('Todas');

            useEffect(() => {
                fetch('data/productos.json')
                    .then(res => {
                        if (!res.ok) throw new Error('No se pudo cargar productos.json');
                        return res.json();
                    })
                    .then(data => {
                        setProductos(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            // Extraer categorías únicas
            const categorias = ['Todas', ...new Set(productos.map(p => p.Categorias).filter(Boolean))];

            const filtered = productos.filter(p => {
                const matchSearch = !search || 
                    (p.Nombre || '').toLowerCase().includes(search.toLowerCase()) ||
                    (p.SKU || '').toLowerCase().includes(search.toLowerCase());
                const matchCat = categoria === 'Todas' || p.Categorias === categoria;
                return matchSearch && matchCat;
            });

            // Iconos según categoría
            const getIcon = (cat) => {
                if (!cat) return '📦';
                const c = cat.toUpperCase();
                if (c.includes('BROTHER') || c.includes('HP') || c.includes('CANON') || c.includes('EPSON') || c.includes('TINTA') || c.includes('TONER') || c.includes('TAMBOR')) return '🖨️';
                if (c.includes('LED') || c.includes('ILUMINACION') || c.includes('BOMBILLA') || c.includes('DOWNLIGHT')) return '💡';
                if (c.includes('HERRAMIENTA') || c.includes('BROCAS') || c.includes('CORTE')) return '🔧';
                if (c.includes('RIEGO') || c.includes('JARDIN')) return '🌳';
                if (c.includes('CANDADO') || c.includes('SEGURIDAD') || c.includes('CAJA')) return '🛡️';
                if (c.includes('CABLE') || c.includes('MECANISMO') || c.includes('ENCHUFE')) return '🔌';
                if (c.includes('COCINA')) return '🍳';
                if (c.includes('AUTOMOVIL')) return '🚗';
                if (c.includes('BICICLETA')) return '🚲';
                if (c.includes('PLAGAS')) return '🦟';
                if (c.includes('PINTURA')) return '🎨';
                if (c.includes('BAÑO')) return '🚿';
                return '📦';
            };

            const formatPrice = (price) => {
                const num = parseFloat(price);
                if (isNaN(num)) return price || '-';
                return num.toFixed(2).replace('.', ',') + ' €';
            };

            return (
                <div>
                    <div className="logo">DCHLOES</div>
                    <div style={{ textAlign: 'center' }}>
                        <span className="badge">Catálogo Tintadecor</span>
                    </div>
                    
                    <input 
                        className="search-box" 
                        placeholder="Buscar por nombre, referencia o marca..." 
                        value={search}
                        onChange={e => setSearch(e.target.value)}
                    />

                    <div className="filters">
                        {categorias.slice(0, 20).map(cat => (
                            <button 
                                key={cat}
                                className={`filter-btn ${categoria === cat ? 'active' : ''}`}
                                onClick={() => setCategoria(cat)}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {loading && <div className="loading">Cargando catálogo...</div>}
                    {error && <div className="error">Error: {error}</div>}
                    
                    {!loading && !error && (
                        <>
                            <div className="stats">{filtered.length} productos encontrados</div>
                            <div className="grid">
                                {filtered.slice(0, 100).map((p, i) => (
                                    <div className="card" key={i}>
                                        <div className="card-img">{getIcon(p.Categorias)}</div>
                                        <div className="info">
                                            <div className="ref">{p.SKU}</div>
                                            <div className="name">{p.Nombre}</div>
                                            <div className="cat">{p.Categorias}</div>
                                            <div className="price">{formatPrice(p['Precio normal'])}</div>
                                            <div className={`status ${p.Publicado === '1' ? 'avail' : 'sold'}`}>
                                                {p.Publicado === '1' ? 'Disponible' : 'No disponible'}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {filtered.length > 100 && (
                                <div className="stats">Mostrando 100 de {filtered.length} productos. Usa el buscador para filtrar.</div>
                            )}
                        </>
                    )}
                    
                    <footer>© 2026 DCHLOES. Todos los derechos reservados.</footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
