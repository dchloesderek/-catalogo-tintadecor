<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Tintadecor | DCHLOES</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --black: #0a0a0a; --gold: #d4a574; --gray-dark: #2a2a2a; }
        body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #fff; padding: 10px; }
        .logo { font-size: 24px; font-weight: 700; color: #d4a574; text-align: center; padding: 10px 0; }
        .badge { background: #d4a574; color: #000; padding: 4px 12px; border-radius: 12px; font-size: 11px; display: inline-block; margin: 0 auto 10px; text-align: center; }
        .search-box { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #d4a574; color: #fff; border-radius: 6px; font-size: 14px; margin: 8px 0; }
        .filter-select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #d4a574; color: #fff; border-radius: 6px; font-size: 13px; margin: 8px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 0; }
        .card { background: #2a2a2a; border-radius: 8px; overflow: hidden; border: 1px solid rgba(212,165,116,0.2); }
        .card img { width: 100%; height: 140px; object-fit: cover; background: #1a1a1a; }
        .info { padding: 10px; }
        .ref { font-size: 10px; color: #d4a574; font-weight: 600; }
        .name { font-size: 12px; margin: 4px 0; color: #f5f5f5; }
        .cat { font-size: 10px; color: rgba(212,165,116,0.7); margin-bottom: 6px; }
        .price { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; }
        .price-t { color: #fff; font-weight: 700; }
        .price-a { color: #d4a574; font-weight: 700; }
        .status { padding: 4px; border-radius: 4px; font-size: 10px; font-weight: 600; text-align: center; margin-top: 6px; }
        .avail { background: rgba(100,200,100,0.2); color: #64c864; }
        .sold { background: rgba(200,100,100,0.2); color: #c86464; }
        .stats { color: #d4a574; font-size: 12px; text-align: center; padding: 8px 0; }
        footer { text-align: center; color: rgba(255,255,255,0.4); font-size: 10px; padding: 15px 0; }
        .loading { text-align: center; padding: 40px; color: #d4a574; font-size: 14px; }
        .error { text-align: center; padding: 40px; color: #c86464; font-size: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [packs, setPacks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [search, setSearch] = useState('');

            useEffect(() => {
                fetch('data/packs.json')
                    .then(res => {
                        if (!res.ok) throw new Error('No se pudo cargar packs.json');
                        return res.json();
                    })
                    .then(data => {
                        setPacks(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            const filtered = packs.filter(p => 
                p.nombre.toLowerCase().includes(search.toLowerCase()) ||
                p.id.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div>
                    <div className="logo">DCHLOES</div>
                    <div style={{ textAlign: 'center' }}>
                        <span className="badge">Catálogo Tintadecor</span>
                    </div>
                    
                    <input 
                        className="search-box" 
                        placeholder="Buscar pack..." 
                        value={search}
                        onChange={e => setSearch(e.target.value)}
                    />

                    {loading && <div className="loading">Cargando catálogo...</div>}
                    {error && <div className="error">Error: {error}</div>}
                    
                    {!loading && !error && (
                        <>
                            <div className="stats">{filtered.length} packs encontrados</div>
                            <div className="grid">
                                {filtered.map(pack => (
                                    <div className="card" key={pack.id}>
                                        <img src={pack.imagen} alt={pack.nombre} onError={(e) => { e.target.style.display = 'none'; }} />
                                        <div className="info">
                                            <div className="ref">{pack.id}</div>
                                            <div className="name">{pack.nombre}</div>
                                            <div className="cat">{pack.productos.length} productos</div>
                                            <div className="status avail">Disponible</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                    
                    <footer>© 2026 DCHLOES. Todos los derechos reservados.</footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
